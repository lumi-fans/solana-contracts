[package]
name = "lumi-support"
version = "0.1.0"
description = "Lumi direct support: gifts and membership charges, 99.9% to the creator and 0.1% to the treasury in one instruction"
edition = "2021"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "lumi_support"

[features]
default = []
# Only scripts/local/stack.ts builds this into a separate, disposable artifact.
local-clock = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
solana-security-txt = "1.1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))', 'cfg(target_os, values("solana"))'] }
